version: 2

project_name: bb

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X 'github.com/payfacto/bb/cmd.Version=v{{.Version}}'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  # `auto` marks any semver prerelease (v1.2.3-rc.1) as a GitHub prerelease.
  # The default is false, which published v0.11.0-rc.1 as a stable "Latest"
  # release. brews.skip_upload reads the semver directly, so the Homebrew tap
  # was never at risk, but the Release itself was mislabelled.
  prerelease: auto

# Changelog note, post-mirror: GoReleaser resolves the previous tag only from
# tags reachable from the tagged commit. Tags v0.3.5-v0.10.1 were deleted from
# the GitHub mirror during cutover, so for a while the previous tag resolved
# back to v0.3.4 and the changelog would have spanned 105 commits. Tagging
# v0.11.0-rc.1 fixed that: it is reachable from the mirror tip and is now the
# newest reachable tag, so v0.11.0 and everything after resolve normally.
# Do NOT set `disable: true` here - it would silently kill every changelog.
changelog:
  sort: asc
  filters:
    exclude:
      # Matches `docs:` and `docs(scope):`. The old `^docs:` pattern required a
      # literal colon straight after `docs`, so `docs(plan):` leaked through.
      - '^docs(\(.*\))?:'
      - '^test(\(.*\))?:'
      - '^chore(\(.*\))?:'
      - Merge pull request
      - Merge branch

brews:
  - repository:
      owner: payfacto
      name: homebrew-tap
    # `auto` skips the tap push for prereleases. Without this the default is
    # false, so tagging v0.11.0-rc.1 to smoke-test the mirror would publish a
    # prerelease formula over the stable one.
    skip_upload: auto
    directory: Formula
    homepage: https://github.com/payfacto/bb
    description: Bitbucket Cloud CLI — manage PRs, pipelines, branches, and more
    license: MIT
    install: bin.install "bb"
    test: |
      system "#{bin}/bb", "--help"
